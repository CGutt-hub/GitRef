name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: gitref-linux
            ext: ""
          - os: windows-latest
            artifact: gitref-windows
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build binary
        run: >
          pyinstaller --onefile --name gitref${{ matrix.ext }}
          --hidden-import=gitref.watcher
          --hidden-import=watchdog
          --hidden-import=watchdog.observers
          --add-data "gitref/templates:gitref/templates"
          gitref/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/gitref${{ matrix.ext }}

  # Build Linux AppImage
  appimage:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build onefile
        run: >
          pyinstaller --onefile --name gitref
          --hidden-import=gitref.watcher
          --hidden-import=watchdog
          --hidden-import=watchdog.observers
          --add-data "gitref/templates:gitref/templates"
          gitref/__main__.py

      - name: Create AppImage structure
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/gitref AppDir/usr/bin/gitref
          chmod +x AppDir/usr/bin/gitref

          cat > AppDir/gitref.desktop << 'EOF'
          [Desktop Entry]
          Name=GitRef
          Exec=gitref
          Icon=gitref
          Type=Application
          Categories=Science;Education;
          Comment=Git-based reference manager
          Terminal=true
          EOF
          cp AppDir/gitref.desktop AppDir/usr/share/applications/

          # Minimal icon (1x1 orange PNG placeholder)
          python3 -c "
          import struct, zlib
          def png(w,h):
            raw=b''
            for _ in range(h): raw+=b'\x00'+b'\xff\x80\x00'*w
            return b'\x89PNG\r\n\x1a\n'+struct.pack('>II',13,0x49484452)+struct.pack('>IIBB',w,h,8,2)+b'\x00\x00\x00'+struct.pack('>I',zlib.crc32(struct.pack('>IIBB',w,h,8,2)+b'\x00\x00\x00',0x49484452)&0xffffffff)+struct.pack('>I',len(zlib.compress(raw)))+b'IDAT'+zlib.compress(raw)+struct.pack('>I',zlib.crc32(zlib.compress(raw),0x49444154)&0xffffffff)+b'\x00\x00\x00\x00IEND\xae\x42\x60\x82'
          open('AppDir/gitref.png','wb').write(png(16,16))
          " || true
          cp AppDir/gitref.png AppDir/usr/share/icons/hicolor/256x256/apps/ || true

          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/gitref" "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir GitRef-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gitref-appimage
          path: GitRef-x86_64.AppImage

  release:
    runs-on: ubuntu-latest
    needs: [build, appimage]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/gitref-linux/gitref
            artifacts/gitref-windows/gitref.exe
            artifacts/gitref-appimage/GitRef-x86_64.AppImage
          generate_release_notes: true

  pypi:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build package
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
